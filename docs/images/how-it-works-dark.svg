<svg xmlns="http://www.w3.org/2000/svg" width="880" height="448" viewBox="0 0 880 448" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" role="img" aria-labelledby="title"><title id="title">How Firstlight works</title><defs><filter id="lift" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#000" flood-opacity="0.35"/></filter><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#8E8E93"/></marker></defs><rect width="880" height="448" rx="20" fill="#1C1C1E"/><rect x="20" y="150" width="840" height="138" rx="16" fill="#232325" stroke="#38383A"/><text class="label" x="36" y="172" font-size="12.5" font-weight="600" fill="#A1A1A6">A run · GitHub Actions every 2 hours, or the laptop</text><g class="box" id="crawl"><rect x="20" y="20" width="200" height="76" rx="12" fill="#2C2C2E" stroke="#3A3A3C" filter="url(#lift)"/><text x="34" y="54.2" font-size="14" font-weight="600" fill="#F5F5F7">Common Crawl index</text><text x="34" y="70.6" font-size="12" font-weight="400" fill="#A1A1A6">job-board accounts</text></g><g class="box" id="list"><rect x="360" y="20" width="230" height="76" rx="12" fill="#2C2C2E" stroke="#3A3A3C" filter="url(#lift)"/><text x="374" y="54.2" font-size="14" font-weight="600" fill="#F5F5F7">Generated company list</text><text x="374" y="70.6" font-size="12" font-weight="400" fill="#A1A1A6">about 17,000 companies</text></g><g class="box" id="config"><rect x="650" y="20" width="210" height="76" rx="12" fill="#2C2C2E" stroke="#3A3A3C" filter="url(#lift)"/><text x="664" y="54.2" font-size="14" font-weight="600" fill="#F5F5F7">Your config</text><text x="664" y="70.6" font-size="12" font-weight="400" fill="#A1A1A6">profile, rules, companies</text></g><g class="box" id="fetch"><rect x="36.0" y="184" width="180" height="88" rx="12" fill="#2C2C2E" stroke="#3A3A3C" filter="url(#lift)"/><text x="50.0" y="216.2" font-size="14" font-weight="600" fill="#F5F5F7">Fetch job boards</text><text x="50.0" y="232.6" font-size="12" font-weight="400" fill="#A1A1A6">polite HTTP,</text><text x="50.0" y="248.6" font-size="12" font-weight="400" fill="#A1A1A6">robots.txt</text></g><g class="box" id="filter"><rect x="245.33333333333334" y="184" width="180" height="88" rx="12" fill="#2C2C2E" stroke="#3A3A3C" filter="url(#lift)"/><text x="259.33333333333337" y="216.2" font-size="14" font-weight="600" fill="#F5F5F7">Pre-filter</text><text x="259.33333333333337" y="232.6" font-size="12" font-weight="400" fill="#A1A1A6">titles, countries,</text><text x="259.33333333333337" y="248.6" font-size="12" font-weight="400" fill="#A1A1A6">duplicates</text></g><g class="box" id="check"><rect x="454.6666666666667" y="184" width="180" height="88" rx="12" fill="#2C2C2E" stroke="#3A3A3C" filter="url(#lift)"/><text x="468.6666666666667" y="224.2" font-size="14" font-weight="600" fill="#F5F5F7">Title check</text><text x="468.6666666666667" y="240.6" font-size="12" font-weight="400" fill="#A1A1A6">Haiku, batches of 100</text></g><g class="box" id="score"><rect x="664.0" y="184" width="180" height="88" rx="12" fill="#2C2C2E" stroke="#3A3A3C" filter="url(#lift)"/><text x="678.0" y="216.2" font-size="14" font-weight="600" fill="#F5F5F7">Score</text><text x="678.0" y="232.6" font-size="12" font-weight="400" fill="#A1A1A6">Haiku, then Sonnet</text><text x="678.0" y="248.6" font-size="12" font-weight="400" fill="#A1A1A6">for promising roles</text></g><g class="box" id="sqlite"><rect x="36.0" y="352" width="174" height="76" rx="12" fill="#2C2C2E" stroke="#3A3A3C" filter="url(#lift)"/><text x="50.0" y="378.2" font-size="14" font-weight="600" fill="#F5F5F7">SQLite</text><text x="50.0" y="394.6" font-size="12" font-weight="400" fill="#A1A1A6">applications, notes,</text><text x="50.0" y="410.6" font-size="12" font-weight="400" fill="#A1A1A6">drafts</text></g><g class="box" id="app"><rect x="240" y="352" width="180" height="76" rx="12" fill="#2C2C2E" stroke="#3A3A3C" filter="url(#lift)"/><text x="254" y="386.2" font-size="14" font-weight="600" fill="#F5F5F7">Local web app</text><text x="254" y="402.6" font-size="12" font-weight="400" fill="#A1A1A6">on localhost</text></g><g class="box" id="data"><rect x="484" y="352" width="160" height="76" rx="12" fill="#2C2C2E" stroke="#3A3A3C" filter="url(#lift)"/><text x="498" y="386.2" font-size="14" font-weight="600" fill="#F5F5F7">Data branch</text><text x="498" y="402.6" font-size="12" font-weight="400" fill="#A1A1A6">JSONL records</text></g><g class="box" id="alert"><rect x="664.0" y="352" width="180" height="76" rx="12" fill="#2C2C2E" stroke="#3A3A3C" filter="url(#lift)"/><text x="678.0" y="386.2" font-size="14" font-weight="600" fill="#F5F5F7">Phone alert</text><text x="678.0" y="402.6" font-size="12" font-weight="400" fill="#A1A1A6">for fit 7+</text></g><path d="M220.0,58.0 L358.0,58.0" fill="none" stroke="#8E8E93" stroke-width="1.5" marker-end="url(#head)"/><text class="label" x="290.0" y="50.0" font-size="12" fill="#A1A1A6" text-anchor="middle">monthly harvest</text><path d="M475.0,96.0 L475.0,148.0" fill="none" stroke="#8E8E93" stroke-width="1.5" marker-end="url(#head)"/><path d="M755.0,96.0 L755.0,148.0" fill="none" stroke="#8E8E93" stroke-width="1.5" marker-end="url(#head)"/><path d="M216.0,228.0 L243.3,228.0" fill="none" stroke="#8E8E93" stroke-width="1.5" marker-end="url(#head)"/><path d="M425.3,228.0 L452.7,228.0" fill="none" stroke="#8E8E93" stroke-width="1.5" marker-end="url(#head)"/><path d="M634.7,228.0 L662.0,228.0" fill="none" stroke="#8E8E93" stroke-width="1.5" marker-end="url(#head)"/><path d="M784.0,272.0 L784.0,350.0" fill="none" stroke="#8E8E93" stroke-width="1.5" marker-end="url(#head)"/><path d="M724.0,272.0 L724.0,320.0 L564.0,320.0 L564.0,350.0" fill="none" stroke="#8E8E93" stroke-width="1.5" marker-end="url(#head)"/><path d="M484.0,390.0 L422.0,390.0" fill="none" stroke="#8E8E93" stroke-width="1.5" marker-end="url(#head)"/><text class="label" x="452.0" y="382.0" font-size="12" fill="#A1A1A6" text-anchor="middle">sync</text><path d="M210.0,390.0 L238.0,390.0" fill="none" stroke="#8E8E93" stroke-width="1.5" marker-end="url(#head)"/></svg>
